version: 2.1

parameters:
  run-classic:
    type: boolean
    default: true
  run-smarter:
    type: boolean
    default: true
  run-android:
    type: boolean
    default: true
  run-ios:
    type: boolean
    default: true

executors:
  linux-node:
    docker:
      - image: cimg/node:24.11.0
    resource_class: medium
    environment:
      CI: "true"
  android:
    docker:
      - image: cimg/android:2026.08.1
    resource_class: medium
    environment:
      CI: "true"
  macos:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    environment:
      CI: "true"

commands:
  ensure-node:
    steps:
      - run:
          name: Ensure Node is on PATH
          command: |
            if ! command -v node >/dev/null 2>&1; then
              echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            fi
      - run:
          name: Print Node version
          command: node --version && npm --version

  install-demo:
    steps:
      - checkout
      - ensure-node
      - restore_cache:
          keys:
            - demo-npm-v1-{{ checksum "demo/package-lock.json" }}
            - demo-npm-v1-
      - run:
          name: Install demo dependencies
          command: npm ci
          working_directory: demo
      - save_cache:
          key: demo-npm-v1-{{ checksum "demo/package-lock.json" }}
          paths:
            - ~/.npm

  ensure-testsuite:
    steps:
      - run:
          name: Ensure testsuite CLI
          command: |
            if circleci testsuite --help >/dev/null 2>&1; then
              echo "circleci testsuite is available"
              exit 0
            fi
            if circleci extension install --help >/dev/null 2>&1; then
              circleci extension install testsuite
              exit 0
            fi
            echo "Installing the CircleCI CLI, then the testsuite extension"
            curl -fLSs https://cli.circleci.com/install | bash
            circleci extension install testsuite

jobs:
  # Deliberately unoptimized: always the full suite, 15-wide, split by name
  # (not timings), Jest --runInBand, and a per-test delay. Unbalanced shards
  # are the point — later-alphabet domains (users, warehouse) are heavier.
  classic-tests:
    parameters:
      os:
        type: executor
        default: linux-node
      parallelism:
        type: integer
        default: 15
    executor: << parameters.os >>
    parallelism: << parameters.parallelism >>
    environment:
      DEMO_TEST_DELAY_MS: "300"
    steps:
      - install-demo
      - run:
          name: Discover and run the full suite
          command: |
            mkdir -p test-reports
            echo "Classic path: run every demo test. No TIA, no test-suites, no timings split."
            echo "Split by name only (circleci tests split --split-by=name). Parallelism ${CIRCLE_NODE_TOTAL}."
            TEST_FILES=$(circleci tests glob "demo/src/**/*.test.js")
            echo "Discovered $(printf '%s\n' "${TEST_FILES}" | sed '/^$/d' | wc -l | tr -d ' ') test files."
            # Naive split — do not use --split-by=timings. Uneven shards are expected.
            SPLIT_FILES=$(printf '%s\n' "${TEST_FILES}" | circleci tests split --split-by=name)
            echo "This node (index ${CIRCLE_NODE_INDEX}) will run:"
            printf '%s\n' "${SPLIT_FILES}"
            JEST_JUNIT_OUTPUT_FILE="test-reports/junit.xml" \
              demo/jest.sh --ci --runInBand --runTestsByPath ${SPLIT_FILES}
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  # TIA + dynamic split on 2 nodes (enough to show a split without idle
  # containers), Jest workers, short per-test delay. On a feature branch it runs
  # only the impacted test files; classic always runs all of them 15-wide.
  smarter-tests:
    parameters:
      os:
        type: executor
        default: linux-node
      parallelism:
        type: integer
        default: 2
    executor: << parameters.os >>
    parallelism: << parameters.parallelism >>
    environment:
      DEMO_TEST_DELAY_MS: "15"
    steps:
      - install-demo
      - ensure-testsuite
      - run:
          name: Run smarter tests
          command: |
            mkdir -p test-reports
            circleci testsuite run "demo tests"
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  # main is frozen for this demo, so vijay-2026-10-08-demo plays the default
  # branch for the mobile suites: it refreshes their impact data, and every
  # other branch only selects. Same pattern as the docs' "develop" example.
  android-tests:
    executor: android
    parallelism: 2
    steps:
      - checkout
      - restore_cache:
          keys:
            - android-gradle-v1-{{ checksum "android/build.gradle.kts" }}
            - android-gradle-v1-
      - run:
          name: Compile the module and tests
          command: gradle -p android --daemon --console=plain testClasses
      - save_cache:
          key: android-gradle-v1-{{ checksum "android/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
      - ensure-testsuite
      - run:
          name: Run Android unit tests
          command: |
            mkdir -p test-reports
            circleci testsuite run "android unit tests" \
              --analyze-tests=<< pipeline.git.branch == "vijay-2026-10-08-demo" and "impacted" or "none" >>
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  ios-tests:
    executor: macos
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Build the Swift package and tests
          command: swift build --package-path ios --build-tests
      - ensure-testsuite
      - run:
          name: Run iOS unit tests
          command: |
            mkdir -p test-reports
            circleci testsuite run "ios unit tests" \
              --analyze-tests=<< pipeline.git.branch == "vijay-2026-10-08-demo" and "impacted" or "none" >>
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

workflows:
  classic-full-suite:
    when: << pipeline.parameters.run-classic >>
    jobs:
      - classic-tests:
          name: classic-tests
          os: linux-node
          parallelism: 15

  smarter-testing:
    when: << pipeline.parameters.run-smarter >>
    jobs:
      - smarter-tests:
          name: smarter-tests
          os: linux-node
          parallelism: 2

  android-smarter-testing:
    when: << pipeline.parameters.run-android >>
    jobs:
      - android-tests

  ios-smarter-testing:
    when: << pipeline.parameters.run-ios >>
    jobs:
      - ios-tests
