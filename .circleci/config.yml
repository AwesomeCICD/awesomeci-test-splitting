version: 2.1

parameters:
  run-macos:
    type: boolean
    default: false
  run-classic:
    type: boolean
    default: true
  run-smarter:
    type: boolean
    default: true
  # Set to "all" to rebuild the TIA impact map from scratch (coverage on
  # every test atom). Leave at "default" for normal runs.
  analyze-tests:
    type: enum
    enum: [default, all]
    default: default

executors:
  linux-node:
    docker:
      # Exact tag from the org's approved_language_images policy
      # (AwesomeCICD/circleci-policies). Other tags are rejected.
      - image: cimg/node:24.22.1
    resource_class: medium
    environment:
      CI: "true"
  macos-node:
    macos:
      xcode: "26.6.0"
    resource_class: m4pro.medium
    environment:
      CI: "true"

commands:
  ensure-node:
    steps:
      - run:
          name: Ensure Node is on PATH
          command: |
            if ! command -v node >/dev/null 2>&1; then
              echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            fi
      - run:
          name: Print Node version
          command: node --version && npm --version

  install-demo:
    steps:
      - checkout
      - ensure-node
      - restore_cache:
          keys:
            - demo-npm-v1-{{ checksum "demo/package-lock.json" }}
            - demo-npm-v1-
      - run:
          name: Install demo dependencies
          command: npm ci
          working_directory: demo
      - save_cache:
          key: demo-npm-v1-{{ checksum "demo/package-lock.json" }}
          paths:
            - ~/.npm

  ensure-testsuite:
    steps:
      - run:
          name: Ensure testsuite CLI
          command: |
            if circleci testsuite --help >/dev/null 2>&1; then
              echo "circleci testsuite is available"
              exit 0
            fi
            if circleci extension install --help >/dev/null 2>&1; then
              circleci extension install testsuite
              exit 0
            fi
            echo "Installing the CircleCI CLI, then the testsuite extension"
            curl -fLSs https://cli.circleci.com/install | bash
            circleci extension install testsuite

  run-smarter-tests:
    steps:
      - install-demo
      - ensure-testsuite
      - run:
          name: Run smarter tests
          command: |
            mkdir -p test-reports
            echo "Dynamic parallelism picked ${CIRCLE_NODE_TOTAL} node(s) for this run."
            circleci testsuite run "demo tests" --analyze-tests=<< pipeline.parameters.analyze-tests >>
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

jobs:
  # Deliberately unoptimized: always the full suite, 15-wide, split by name
  # (not timings), Jest --runInBand, and a per-test delay. Unbalanced shards
  # are the point — later-alphabet domains (users, warehouse) are heavier.
  classic-tests:
    parameters:
      os:
        type: executor
        default: linux-node
      parallelism:
        type: integer
        default: 15
    executor: << parameters.os >>
    parallelism: << parameters.parallelism >>
    environment:
      DEMO_TEST_DELAY_MS: "300"
    steps:
      - install-demo
      - run:
          name: Discover and run the full suite
          command: |
            mkdir -p test-reports
            echo "Classic path: run every demo test. No TIA, no test-suites, no timings split."
            echo "Split by name only (circleci tests split --split-by=name). Parallelism ${CIRCLE_NODE_TOTAL}."
            TEST_FILES=$(circleci tests glob "demo/src/**/*.test.js")
            echo "Discovered $(printf '%s\n' "${TEST_FILES}" | sed '/^$/d' | wc -l | tr -d ' ') test files."
            # Naive split — do not use --split-by=timings. Uneven shards are expected.
            SPLIT_FILES=$(printf '%s\n' "${TEST_FILES}" | circleci tests split --split-by=name)
            echo "This node (index ${CIRCLE_NODE_INDEX}) will run:"
            printf '%s\n' "${SPLIT_FILES}"
            JEST_JUNIT_OUTPUT_FILE="test-reports/junit.xml" \
              demo/jest.sh --ci --runInBand --runTestsByPath ${SPLIT_FILES}
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  # Upstream half of dynamic parallelism: runs the suite's discover + TIA
  # selection without running tests, and publishes the selection under
  # `key` so CircleCI can size the downstream test job's parallelism.
  smarter-list-tests:
    parameters:
      os:
        type: executor
        default: linux-node
      key:
        type: string
    executor: << parameters.os >>
    steps:
      - install-demo
      - ensure-testsuite
      - run:
          name: List selected test atoms
          command: circleci testsuite list-tests "demo tests" --key=<< parameters.key >>

  # Optimized to win: TIA + dynamic split + dynamic parallelism, Jest
  # workers, short per-test delay. `parallelism` is only the fallback (and
  # full-suite ceiling); the real node count comes from the
  # experimental.dynamic-parallelism stanza below. Feature-branch wow is one
  # module on one node vs classic's 15-wide full suite.
  smarter-tests:
    executor: linux-node
    parallelism: 15
    environment:
      DEMO_TEST_DELAY_MS: "15"
    steps:
      - run-smarter-tests

  # Separate job (not a parameterized smarter-tests) so the
  # dynamic-parallelism stanza can key on an unambiguous job name.
  smarter-tests-macos:
    executor: macos-node
    parallelism: 2
    environment:
      DEMO_TEST_DELAY_MS: "15"
    steps:
      - run-smarter-tests

workflows:
  classic-full-suite:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-classic >>]
        - equal: [false, << pipeline.parameters.run-macos >>]
    jobs:
      - classic-tests:
          name: classic-tests
          os: linux-node
          parallelism: 15

  smarter-testing:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-smarter >>]
        - equal: [false, << pipeline.parameters.run-macos >>]
    jobs:
      - smarter-list-tests:
          name: smarter-list-tests
          os: linux-node
          key: demo-tests-linux-parallelism
      - smarter-tests:
          requires:
            - smarter-list-tests

  # macOS is the same jobs on a different executor — not the timing showcase.
  # Parallelism is capped at 2 so we do not spin 15 macOS VMs. Linux classic is the contrast.
  classic-full-suite-macos:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-classic >>]
        - equal: [true, << pipeline.parameters.run-macos >>]
    jobs:
      - classic-tests:
          name: classic-tests-macos
          os: macos-node
          parallelism: 2

  smarter-testing-macos:
    when:
      and:
        - equal: [true, << pipeline.parameters.run-smarter >>]
        - equal: [true, << pipeline.parameters.run-macos >>]
    jobs:
      - smarter-list-tests:
          name: smarter-list-tests-macos
          os: macos-node
          key: demo-tests-macos-parallelism
      - smarter-tests-macos:
          requires:
            - smarter-list-tests-macos

# Dynamic parallelism (Smarter Testing, experimental syntax — will change).
# Each key is a test job name; `key` must match the --key passed to
# `circleci testsuite list-tests` in the upstream job. With no `target`,
# CircleCI scales `max` by the share of the suite TIA selected: the full
# suite on main gets `max`, a one-module feature branch drops to `min`.
# https://circleci.com/docs/guides/test/set-parallelism-dynamically/
experimental:
  dynamic-parallelism:
    smarter-tests:
      key: demo-tests-linux-parallelism
      min: 1
      max: 15
    smarter-tests-macos:
      key: demo-tests-macos-parallelism
      min: 1
      max: 2
